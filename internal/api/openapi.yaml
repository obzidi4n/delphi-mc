openapi: 3.1.0
info:
  title: DelphiMC panel API
  version: 0.3.0
  description: |
    The control-plane API. Every mutation is a capability call behind the
    requesting principal's scopes; every mutation is audited.
  license:
    name: MIT
servers:
  - url: https://127.0.0.1:8443
    description: Panel root (API paths are absolute).
security:
  - bearerAuth: []
paths:
  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: List fleet nodes
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/nodes/{id}/revoke:
    post:
      operationId: revokeNode
      summary: Revoke a node certificate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked; the agent channel closes within one heartbeat }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      summary: Mint a one-time enrollment token
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTokenRequest" }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers:
    get:
      operationId: listServers
      summary: List live servers
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createServer
      summary: Create a server and sync its node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}:
    get:
      operationId: getServer
      summary: Fetch one server
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: renameServer
      summary: Rename a server
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteServer
      summary: Soft-delete a server
      description: |
        Stops the container and removes it; the data directory is kept for seven
        days before the GC purges it. Requires ?confirm=<server name>.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: confirm
          in: query
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Deleted row (deleted_at and purge_after set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files:
    get:
      operationId: listServerFiles
      summary: List a server directory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/content:
    get:
      operationId: readServerFile
      summary: Read a text file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContentDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Problem" }
    put:
      operationId: writeServerFile
      summary: Write a text file and record a revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileWriteRequest" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileWriteResultDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/revisions:
    get:
      operationId: listFileRevisions
      summary: List revisions for one path
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileRevisionListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers/{id}/files/revisions/{rev}:
    get:
      operationId: getFileRevision
      summary: Read one revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rev
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revision content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContentDTO" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/rollback:
    post:
      operationId: rollbackServerFile
      summary: Restore a revision as a new revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileRollbackRequest" }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileWriteResultDTO" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/diff:
    get:
      operationId: diffServerFile
      summary: Unified diff between two revisions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: integer }
        - name: to
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDiffDTO" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/bridge:
    get:
      operationId: getServerBridge
      summary: Read the plugin snapshot (TPS, players, command tree)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest snapshot; empty fields when the plugin has not reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BridgeDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/moderation:
    post:
      operationId: moderatePlayer
      summary: Kick or ban a player through the bridge
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "202":
          description: Command accepted; the result arrives as a bridge.event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationAcceptedDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/metrics:
    get:
      operationId: getServerMetrics
      summary: Read CPU and memory rollups
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: resolution
          in: query
          required: false
          schema: { type: string, enum: [1s, 15s, 5m] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Points, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerMetricsDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/power:
    post:
      operationId: powerServer
      summary: Request a power action
      description: Bumps desired_revision; the next agent sync converges the container.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PowerRequest" }
      responses:
        "202":
          description: Updated server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/groups:
    get:
      operationId: listGroups
      summary: List server groups
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createGroup
      summary: Create a server group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/groups/{id}/members:
    get:
      operationId: listGroupMembers
      summary: List server ids in a group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addGroupMember
      summary: Add a server to the group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRequest" }
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/groups/{id}/members/{server_id}:
    delete:
      operationId: removeGroupMember
      summary: Remove a server from the group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: server_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Read the audit log, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor (newest-first).
          schema: { type: string }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/api-keys:
    post:
      operationId: createAPIKey
      summary: Mint an API key for the calling user
      description: The token is returned once and stored hashed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APIKeyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyCreatedDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List accounts and their org roles
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createUser
      summary: Create an account with a generated password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "201":
          description: The account and its one-time password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedUserDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{id}/role:
    patch:
      operationId: setUserRole
      summary: Change an account's org role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/status:
    get:
      operationId: getAIStatus
      summary: Whether the assistant is configured
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIStatusDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/ai/conversations:
    get:
      operationId: listAIConversations
      summary: List the caller's AI conversations
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/conversations/{id}:
    get:
      operationId: getAIConversation
      summary: Fetch one conversation and its messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetailDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/approvals:
    get:
      operationId: listAIApprovals
      summary: Pending AI plans for one conversation
      parameters:
        - name: conversation_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIApprovalListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/approvals/{id}/approve:
    post:
      operationId: approveAIPlan
      summary: Execute a pending plan and resume the assistant (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSE resume stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/approvals/{id}/reject:
    post:
      operationId: rejectAIPlan
      summary: Reject a pending plan and resume the assistant (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSE resume stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/chat:
    post:
      operationId: chatWithAI
      summary: Ask the assistant (server-sent events)
      description: |
        Streams `data: {json}` events: delta, tool, citation, done, error. The
        assistant only calls read-only tools.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequestDTO" }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/templates:
    get:
      operationId: listTemplates
      summary: List built-in and org templates
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: importTemplate
      summary: Import a template (JSON or YAML body)
      description: |
        The body is validated as a template; the stored name must be unique in
        the org. The request content type may be application/json or
        application/yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInputDTO" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/templates/{id}:
    get:
      operationId: getTemplate
      summary: Fetch one template with its files
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /agent/enroll:
    post:
      operationId: enrollNode
      summary: Exchange a one-time token and CSR for a node certificate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key or the break-glass admin token.
  responses:
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: Problem details (RFC 9457). `code` is stable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    ServerDTO:
      type: object
      required:
        [id, name, node_id, desired_state, desired_revision, observed_state,
         summary_state, applied_revision, kill_requested, port, image,
         java_version, memory_mb, cpu_cores, base, template_id,
         template_version, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        node_id: { type: string }
        desired_state: { type: string }
        desired_revision: { type: integer, format: int64 }
        observed_state: { type: string }
        summary_state: { type: string }
        applied_revision: { type: integer, format: int64 }
        kill_requested: { type: boolean }
        port: { type: integer }
        image: { type: string }
        java_version: { type: integer }
        memory_mb: { type: integer }
        cpu_cores: { type: number, format: double }
        base: { type: string }
        template_id: { type: string }
        template_version: { type: integer }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        purge_after: { type: string, format: date-time, nullable: true }
    ServerCreateRequest:
      type: object
      required: [name, node_id, image, memory_mb, jar_url, jar_sha256, accept_eula]
      properties:
        name: { type: string }
        node_id: { type: string }
        image: { type: string }
        memory_mb: { type: integer }
        cpu_cores: { type: number, format: double }
        port: { type: integer }
        jar_url: { type: string }
        jar_sha256: { type: string }
        accept_eula: { type: boolean }
        group_id: { type: string }
        desired_state: { type: string }
        template: { type: string }
        overrides:
          type: object
          additionalProperties: { type: string }
    ServerListDTO:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServerDTO" }
        next_cursor: { type: string, nullable: true }
    RenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    PowerRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, stop, restart, kill] }
    GroupDTO:
      type: object
      required: [id, org_id, name, description, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
    GroupCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    GroupListDTO:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupDTO" }
        next_cursor: { type: string, nullable: true }
    MemberRequest:
      type: object
      required: [server_id]
      properties:
        server_id: { type: string }
    MemberListDTO:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { type: string }
        next_cursor: { type: string, nullable: true }
    AuditEntryDTO:
      type: object
      required: [seq, org_id, actor, via, action, target, diff, created_at]
      properties:
        seq: { type: integer, format: int64 }
        org_id: { type: string }
        actor: { type: string }
        via: { type: string }
        action: { type: string }
        target: { type: string }
        diff: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuditListDTO:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntryDTO" }
        next_cursor: { type: string, nullable: true }
    APIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    APIKeyCreatedDTO:
      type: object
      required: [id, name, token, scopes]
      properties:
        id: { type: string }
        name: { type: string }
        token: { type: string }
        scopes:
          type: array
          items: { type: string }
    UserDTO:
      type: object
      required: [id, org_id, email, role, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        email: { type: string }
        role: { type: string }
        created_at: { type: string, format: date-time }
    UserListDTO:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserDTO" }
        next_cursor: { type: string, nullable: true }
    UserCreateRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
        role: { type: string }
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string }
    CreatedUserDTO:
      type: object
      required: [user, password]
      properties:
        user: { $ref: "#/components/schemas/UserDTO" }
        password: { type: string }
    AIStatusDTO:
      type: object
      required: [enabled, model]
      properties:
        enabled: { type: boolean }
        model: { type: string }
    ChatRequestDTO:
      type: object
      required: [message]
      properties:
        conversation_id: { type: string }
        message: { type: string }
    AIMessageDTO:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string }
        role: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }
    ConversationDTO:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConversationDTO" }
    ConversationDetailDTO:
      type: object
      required: [conversation, messages, approvals]
      properties:
        conversation: { $ref: "#/components/schemas/ConversationDTO" }
        messages:
          type: array
