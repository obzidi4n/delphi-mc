    ServerMetricsDTO:
      type: object
      required: [resolution, items]
      properties:
        resolution: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/MetricPointDTO" }
    TemplateDefaultsDTO:
      type: object
      required: [memory_mb, cpu_cores, port]
      properties:
        memory_mb: { type: integer }
        cpu_cores: { type: number, format: double }
        port: { type: integer }
    TemplatePluginDTO:
      type: object
      required: [project, provider]
      properties:
        project: { type: string }
        provider: { type: string }
        version: { type: string }
        range: { type: string }
        required: { type: boolean }
    TemplateVariableDTO:
      type: object
      properties:
        description: { type: string }
        default: { type: string }
        required: { type: boolean }
    TemplateSummaryDTO:
      type: object
      required: [id, name, description, base, mc_version, java, revision, builtin]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        base: { type: string }
        mc_version: { type: string }
        java: { type: integer }
        revision: { type: integer }
        builtin: { type: boolean }
    TemplateListDTO:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TemplateSummaryDTO" }
        next_cursor: { type: string, nullable: true }
    TemplateInputDTO:
      type: object
      required: [schema_version, name, base, mc_version, java]
      properties:
        schema_version: { type: integer }
        name: { type: string }
        description: { type: string }
        base: { type: string }
        mc_version: { type: string }
        java: { type: integer }
        defaults: { $ref: "#/components/schemas/TemplateDefaultsDTO" }
        files:
          type: object
          additionalProperties: { type: string }
        plugins:
          type: array
          items: { $ref: "#/components/schemas/TemplatePluginDTO" }
        variables:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TemplateVariableDTO" }
    TemplateDTO:
      type: object
      required:
        [schema_version, id, name, description, base, mc_version, java, defaults,
         files, plugins, variables, revision, builtin, created_at, updated_at]
      properties:
        schema_version: { type: integer }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        base: { type: string }
        mc_version: { type: string }
        java: { type: integer }
        defaults: { $ref: "#/components/schemas/TemplateDefaultsDTO" }
        files:
          type: object
          additionalProperties: { type: string }
        plugins:
          type: array
          items: { $ref: "#/components/schemas/TemplatePluginDTO" }
        variables:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TemplateVariableDTO" }
        revision: { type: integer }
        builtin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NodeDTO:
