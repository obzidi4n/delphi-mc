        approvals:
          type: array
          items: { $ref: "#/components/schemas/AIApprovalDTO" }
    AIActionDTO:
      type: object
      required: [tool, summary]
      properties:
        tool: { type: string }
        summary: { type: string }
        server_id: { type: string }
        server_name: { type: string }
        action: { type: string }
        command: { type: string }
        player: { type: string }
        reason: { type: string }
        template_id: { type: string }
        new_name: { type: string }
        node_id: { type: string }
        desired_state: { type: string }
        memory_mb: { type: integer }
        port: { type: integer }
    AIProposedCallDTO:
      type: object
      required: [call_id, tool, summary, actions]
      properties:
        call_id: { type: string }
        tool: { type: string }
        summary: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AIActionDTO" }
    AIApprovalDTO:
      type: object
      required: [id, status, created_at, calls]
      properties:
        id: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        calls:
          type: array
          items: { $ref: "#/components/schemas/AIProposedCallDTO" }
    AIApprovalListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AIApprovalDTO" }
    FileEntryDTO:
      type: object
      required: [name, dir, size, mod_time]
      properties:
        name: { type: string }
        dir: { type: boolean }
        size: { type: integer, format: int64 }
        mod_time: { type: string, format: date-time }
    FileListDTO:
      type: object
      required: [path, entries]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/FileEntryDTO" }
    FileContentDTO:
      type: object
      required: [path, content, sha256, size]
      properties:
        path: { type: string }
        content: { type: string }
