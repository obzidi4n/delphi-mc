openapi: 3.1.0
info:
  title: DelphiMC panel API
  version: 0.3.0
  description: |
    The control-plane API. Every mutation is a capability call behind the
    requesting principal's scopes; every mutation is audited.
  license:
    name: MIT
servers:
  - url: https://127.0.0.1:8443
    description: Panel root (API paths are absolute).
security:
  - bearerAuth: []
paths:
  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: List fleet nodes
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/nodes/{id}/revoke:
    post:
      operationId: revokeNode
      summary: Revoke a node certificate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked; the agent channel closes within one heartbeat }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      summary: Mint a one-time enrollment token
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTokenRequest" }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers:
    get:
      operationId: listServers
      summary: List live servers
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createServer
      summary: Create a server and sync its node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}:
    get:
      operationId: getServer
      summary: Fetch one server
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: renameServer
      summary: Rename a server
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteServer
      summary: Soft-delete a server
      description: |
        Stops the container and removes it; the data directory is kept for seven
        days before the GC purges it. Requires ?confirm=<server name>.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: confirm
          in: query
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Deleted row (deleted_at and purge_after set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/networks:
    get:
      operationId: listNetworks
      summary: List Velocity networks
      responses:
        "200":
          description: Networks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createNetwork
      summary: Create a proxy and backends on one container network
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkCreateRequest" }
      responses:
        "201":
          description: Network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkDetailDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/networks/{id}:
    get:
      operationId: getNetwork
      summary: Get a network with its servers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkDetailDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/schedules:
    get:
      operationId: listSchedules
      summary: List cron schedules
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSchedule
      summary: Create a cron schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCreateRequest" }
      responses:
        "201":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/schedules/{id}:
    delete:
      operationId: deleteSchedule
      summary: Delete a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      summary: List alert rules
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createAlertRule
      summary: Create an alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleCreateRequest" }
      responses:
        "201":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/alert-rules/{id}:
    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/alert-channels:
    get:
      operationId: listAlertChannels
      summary: List alert channels (secrets omitted)
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannelListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createAlertChannel
      summary: Create a webhook or SMTP channel (config sealed at rest)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertChannelCreateRequest" }
      responses:
        "201":
          description: Channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannelDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/alert-channels/{id}:
    delete:
      operationId: deleteAlertChannel
      summary: Delete an alert channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: List recent alerts
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/maintenance-windows:
    get:
      operationId: listMaintenanceWindows
      summary: List maintenance windows
      responses:
        "200":
          description: Windows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindowListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMaintenanceWindow
      summary: Create a maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceWindowCreateRequest" }
      responses:
        "201":
          description: Window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindowDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/maintenance-windows/{id}:
    delete:
      operationId: deleteMaintenanceWindow
      summary: Delete a maintenance window
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers/{id}/backups:
    get:
      operationId: listServerBackups
      summary: List snapshots
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Backups, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createServerBackup
      summary: Snapshot a server (quiesced, encrypted at rest)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Ready backup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/backups/{id}/restore:
    post:
      operationId: restoreBackup
      summary: Restore a snapshot into its server and reconcile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restored backup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/backups/{id}:
    delete:
      operationId: deleteBackup
      summary: Delete a snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/plugin-catalog:
    get:
      operationId: searchPluginCatalog
      summary: Search plugin projects on Modrinth or Hangar
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string, enum: [modrinth, hangar] }
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: mc_version
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Matching projects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginCatalogDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers/{id}/plugins:
    get:
      operationId: listServerPlugins
      summary: List managed plugins
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Installed plugins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: installServerPlugin
      summary: Resolve, download, and install one plugin on a server
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginInstallRequest" }
      responses:
        "201":
          description: Installed plugin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginAddResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeServerPlugin
      summary: Remove one managed plugin from a server
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: project
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/updates:
    get:
      operationId: listServerUpdates
      summary: Detect available plugin updates
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available updates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginUpdateListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/updates/apply:
    post:
      operationId: applyServerUpdates
      summary: Install available plugin updates and boot-check the result
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Applied updates; a running server is checked and rolled back on failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginUpdateApplyDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/artifacts/gc:
    post:
      operationId: gcArtifacts
      summary: Delete unreferenced plugin artifacts
      parameters:
        - name: min_age_seconds
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Garbage collection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GCResultDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/config/format:
    post:
      operationId: formatConfigFile
      summary: Validate a config file and pretty-print JSON
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigFormatRequest" }
      responses:
        "200":
          description: Validation and formatting result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFormatDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers/{id}/files:
    get:
      operationId: listServerFiles
      summary: List a server directory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/content:
    get:
      operationId: readServerFile
      summary: Read a text file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContentDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Problem" }
    put:
      operationId: writeServerFile
      summary: Write a text file and record a revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileWriteRequest" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileWriteResultDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/nbt:
    get:
      operationId: readServerFileNBT
      summary: Read a server file as NBT
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: NBT tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NBTDocumentDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/revisions:
    get:
      operationId: listFileRevisions
      summary: List revisions for one path
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileRevisionListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/servers/{id}/files/revisions/{rev}:
    get:
      operationId: getFileRevision
      summary: Read one revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rev
          in: path
          required: true
          schema: { type: integer }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revision content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContentDTO" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/rollback:
    post:
      operationId: rollbackServerFile
      summary: Restore a revision as a new revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileRollbackRequest" }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileWriteResultDTO" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/files/diff:
    get:
      operationId: diffServerFile
      summary: Unified diff between two revisions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: integer }
        - name: to
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDiffDTO" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/bridge:
    get:
      operationId: getServerBridge
      summary: Read the plugin snapshot (TPS, players, command tree)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest snapshot; empty fields when the plugin has not reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BridgeDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/command:
    post:
      operationId: runServerCommand
      summary: Queue a console command through the server bridge
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandRequest" }
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAcceptedDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/moderation:
    post:
      operationId: moderatePlayer
      summary: Kick or ban a player through the bridge
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "202":
          description: Command accepted; the result arrives as a bridge.event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationAcceptedDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/metrics:
    get:
      operationId: getServerMetrics
      summary: Read CPU and memory rollups
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: resolution
          in: query
          required: false
          schema: { type: string, enum: [1s, 15s, 5m] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Points, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerMetricsDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/servers/{id}/power:
    post:
      operationId: powerServer
      summary: Request a power action
      description: Bumps desired_revision; the next agent sync converges the container.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PowerRequest" }
      responses:
        "202":
          description: Updated server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/groups:
    get:
      operationId: listGroups
      summary: List server groups
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createGroup
      summary: Create a server group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/groups/{id}/members:
    get:
      operationId: listGroupMembers
      summary: List server ids in a group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addGroupMember
      summary: Add a server to the group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRequest" }
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/groups/{id}/members/{server_id}:
    delete:
      operationId: removeGroupMember
      summary: Remove a server from the group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: server_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Read the audit log, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor (newest-first).
          schema: { type: string }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/api-keys:
    post:
      operationId: createAPIKey
      summary: Mint an API key for the calling user
      description: The token is returned once and stored hashed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APIKeyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyCreatedDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List accounts and their org roles
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createUser
      summary: Create an account with a generated password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "201":
          description: The account and its one-time password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedUserDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{id}/role:
    patch:
      operationId: setUserRole
      summary: Change an account's org role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/status:
    get:
      operationId: getAIStatus
      summary: Whether the assistant is configured
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIStatusDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/ai/conversations:
    get:
      operationId: listAIConversations
      summary: List the caller's AI conversations
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/conversations/{id}:
    get:
      operationId: getAIConversation
      summary: Fetch one conversation and its messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetailDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/approvals:
    get:
      operationId: listAIApprovals
      summary: Pending AI plans for one conversation
      parameters:
        - name: conversation_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIApprovalListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/approvals/{id}/approve:
    post:
      operationId: approveAIPlan
      summary: Execute a pending plan and resume the assistant (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSE resume stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/approvals/{id}/reject:
    post:
      operationId: rejectAIPlan
      summary: Reject a pending plan and resume the assistant (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSE resume stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/chat:
    post:
      operationId: chatWithAI
      summary: Ask the assistant (server-sent events)
      description: |
        Streams `data: {json}` events: delta, tool, citation, done, error. The
        assistant only calls read-only tools.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequestDTO" }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/templates:
    get:
      operationId: listTemplates
      summary: List built-in and org templates
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateListDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: importTemplate
      summary: Import a template (JSON or YAML body)
      description: |
        The body is validated as a template; the stored name must be unique in
        the org. The request content type may be application/json or
        application/yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInputDTO" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/templates/{id}:
    get:
      operationId: getTemplate
      summary: Fetch one template with its files
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDTO" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateTemplate
      summary: Update an org-owned template
      description: Built-in templates are immutable; duplicate one instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInputDTO" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDTO" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agent/enroll:
    post:
      operationId: enrollNode
      summary: Exchange a one-time token and CSR for a node certificate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key or the break-glass admin token.
  responses:
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: Problem details (RFC 9457). `code` is stable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    ServerDTO:
      type: object
      required:
        [id, name, node_id, desired_state, desired_revision, observed_state,
         summary_state, applied_revision, kill_requested, port, image,
         java_version, memory_mb, cpu_cores, base, template_id,
         template_version, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        node_id: { type: string }
        desired_state: { type: string }
        desired_revision: { type: integer, format: int64 }
        observed_state: { type: string }
        summary_state: { type: string }
        applied_revision: { type: integer, format: int64 }
        kill_requested: { type: boolean }
        port: { type: integer }
        image: { type: string }
        java_version: { type: integer }
        memory_mb: { type: integer }
        cpu_cores: { type: number, format: double }
        base: { type: string }
        template_id: { type: string }
        template_version: { type: integer }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        purge_after: { type: string, format: date-time, nullable: true }
        mc_version: { type: string }
        network_id: { type: string }
        network_role: { type: string }
        plugins:
          type: array
          items: { $ref: "#/components/schemas/ServerPlugin" }
    ServerPlugin:
      type: object
      required: [project, provider, version, policy, name, sha256]
      properties:
        project: { type: string }
        provider: { type: string }
        version: { type: string }
        policy: { type: string, enum: [latest, pinned, range, manual] }
        range: { type: string }
        name: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
    PluginCatalogEntry:
      type: object
      required: [provider, project, title]
      properties:
        provider: { type: string }
        project: { type: string }
        title: { type: string }
        description: { type: string }
        author: { type: string }
        icon_url: { type: string }
        page_url: { type: string }
        downloads: { type: integer, format: int64 }
        versions:
          type: array
          items: { type: string }
    PluginCatalogDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PluginCatalogEntry" }
    PluginInstallRequest:
      type: object
      required: [provider, project]
      properties:
        provider: { type: string, enum: [modrinth, hangar, github] }
        project: { type: string }
        version: { type: string }
        range: { type: string }
    PluginAddResult:
      type: object
      required: [plugin, revision]
      properties:
        plugin: { $ref: "#/components/schemas/ServerPlugin" }
        revision: { type: integer, format: int64 }
    PluginUpdate:
      type: object
      required: [project, provider, current]
      properties:
        project: { type: string }
        provider: { type: string }
        current: { type: string }
        latest: { type: string }
        error: { type: string }
    PluginListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServerPlugin" }
    PluginUpdateListDTO:
      type: object
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PluginUpdate" }
        revision: { type: integer, format: int64 }
    PluginUpdateApplyDTO:
      type: object
      required: [applied, revision, boot_check]
      properties:
        applied:
          type: array
          items: { $ref: "#/components/schemas/PluginUpdate" }
        revision: { type: integer, format: int64 }
        boot_check: { type: string, enum: [pending, skipped] }
    NetworkDTO:
      type: object
      required: [id, name, proxy_server_id, mode, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        proxy_server_id: { type: string }
        mode: { type: string }
        created_at: { type: string, format: date-time }
    NetworkCreateRequest:
      type: object
      required: [name, node_id, accept_eula]
      properties:
        name: { type: string }
        node_id: { type: string }
        proxy_template: { type: string }
        backend_template: { type: string }
        backends: { type: integer }
        accept_eula: { type: boolean }
        mode: { type: string, enum: [legacy, modern] }
    NetworkDetailDTO:
      type: object
      required: [id, name, proxy_server_id, mode, created_at, servers]
      properties:
        id: { type: string }
        name: { type: string }
        proxy_server_id: { type: string }
        mode: { type: string }
        created_at: { type: string, format: date-time }
        servers:
          type: array
          items: { $ref: "#/components/schemas/ServerDTO" }
    NetworkListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NetworkDTO" }
    ScheduleDTO:
      type: object
      required: [id, name, server_id, action, cron, timezone, enabled, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        server_id: { type: string }
        action: { type: string }
        cron: { type: string }
        timezone: { type: string }
        enabled: { type: boolean }
        next_run: { type: string, format: date-time, nullable: true }
        last_run: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ScheduleCreateRequest:
      type: object
      required: [name, server_id, action, cron]
      properties:
        name: { type: string }
        server_id: { type: string }
        action: { type: string, enum: [power.restart, power.start, power.stop, backup.create, updates.apply] }
        cron: { type: string }
        timezone: { type: string }
    ScheduleListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScheduleDTO" }
    AlertRuleDTO:
      type: object
      required: [id, kind, threshold, window_seconds, enabled, created_at]
      properties:
        id: { type: string }
        kind: { type: string }
        threshold: { type: integer }
        window_seconds: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    AlertRuleCreateRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [crash_loop, server_down] }
        threshold: { type: integer }
        window_seconds: { type: integer }
    AlertRuleListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertRuleDTO" }
    AlertChannelDTO:
      type: object
      required: [id, name, kind, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        created_at: { type: string, format: date-time }
    AlertChannelCreateRequest:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string }
        kind: { type: string, enum: [webhook, smtp] }
        config:
          type: object
          additionalProperties: true
    AlertChannelListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertChannelDTO" }
    AlertDTO:
      type: object
      required: [id, rule_id, server_id, state, summary, started_at]
      properties:
        id: { type: string }
        rule_id: { type: string }
        server_id: { type: string }
        state: { type: string }
        summary: { type: string }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
    AlertListDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertDTO" }
    MaintenanceWindowDTO:
      type: object
      required: [id, starts_at, ends_at, suppress_alerts, block_updates, created_at]
      properties:
        id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        suppress_alerts: { type: boolean }
        block_updates: { type: boolean }
        created_at: { type: string, format: date-time }
    MaintenanceWindowCreateRequest:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
