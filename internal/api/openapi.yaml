        size: { type: integer, format: int64 }
    FileWriteRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
        expected_sha256: { type: string }
    FileWriteResultDTO:
      type: object
      required: [path, sha256, revision]
      properties:
        path: { type: string }
        sha256: { type: string }
        revision: { type: integer }
    FileRevisionDTO:
      type: object
      required: [revision, sha256, author, created_at]
      properties:
        revision: { type: integer }
        sha256: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
    FileRevisionListDTO:
      type: object
      required: [path, items]
      properties:
        path: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/FileRevisionDTO" }
    FileRollbackRequest:
      type: object
      required: [path, revision]
      properties:
        path: { type: string }
        revision: { type: integer }
    FileDiffDTO:
      type: object
      required: [path, from, to, diff]
      properties:
        path: { type: string }
        from: { type: integer }
        to: { type: integer }
        diff: { type: string }
    BridgePlayerDTO:
      type: object
      required: [name, uuid]
      properties:
        name: { type: string }
        uuid: { type: string }
    BridgeDTO:
      type: object
      required: [tps, players, commands, updated]
      properties:
        tps: { type: number, format: double }
        players:
          type: array
          items: { $ref: "#/components/schemas/BridgePlayerDTO" }
        commands:
          type: array
          items: { type: string }
        updated: { type: string, format: date-time }
    ModerationRequest:
      type: object
      required: [action, player]
      properties:
        action: { type: string, enum: [kick, ban] }
