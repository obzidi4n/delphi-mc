        reason: { type: string }
    ModerationAcceptedDTO:
      type: object
      required: [id]
      properties:
        id: { type: string }
    MetricPointDTO:
      type: object
      required: [at, cpu_percent, memory_bytes]
      properties:
        at: { type: string, format: date-time }
